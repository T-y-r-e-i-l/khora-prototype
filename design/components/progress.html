<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress — Khora Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/demos.css">
</head>
<body data-section="components" data-page="progress" data-prefix="../">
<main class="ds-main">
  <p class="ds-kicker">Components</p>
  <h1>Progress</h1>
  <p class="ds-lede">Reading score: ring value plus category bars.</p>
  <div class="ds-status documented">Documented</div>
  
    <div class="ds-demo">
      <div class="score">
        <div class="ring">
          <svg width="62" height="62" viewBox="0 0 62 62">
            <circle cx="31" cy="31" r="26" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3"/>
            <circle cx="31" cy="31" r="26" fill="none" stroke="rgba(255,255,255,.72)" stroke-width="3" stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="48"/>
          </svg>
          <div class="val">72</div>
        </div>
        <div class="bars">
          <div class="bar-row"><span>Resonance</span><div class="bar"><i style="width:80%"></i></div></div>
          <div class="bar-row"><span>Tension</span><div class="bar"><i style="width:45%"></i></div></div>
          <div class="bar-row"><span>Clarity</span><div class="bar"><i style="width:62%"></i></div></div>
        </div>
      </div>
    </div>
    
</main>
<script src="../assets/nav.js"></script>
</body>
</html>
