<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orb — Khora Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/demos.css">
</head>
<body data-section="components" data-page="orb" data-prefix="../">
<main class="ds-main">
  <p class="ds-kicker">Components</p>
  <h1>Orb</h1>
  <p class="ds-lede">Signature node mark. Set <code>--c</code> to a category hue. Sizes: default, <code>.sm</code>, <code>.lg</code>.</p>
  <div class="ds-status documented">Documented</div>
  
    <div class="ds-demo">
      <span class="orb sm" style="--c:var(--resonance)"></span>
      <span class="orb" style="--c:var(--tension)"></span>
      <span class="orb lg" style="--c:var(--clarity)"></span>
      <span class="orb lg" style="--c:var(--stance)"></span>
      <span class="orb lg" style="--c:var(--lineage)"></span>
    </div>
    <p>Large orbs animate liquid veins when motion is allowed. Graph nodes also use <code>.gx-orb</code>.</p>
    
</main>
<script src="../assets/nav.js"></script>
</body>
</html>
