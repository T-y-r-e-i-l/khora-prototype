<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modal — Khora Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/demos.css">
</head>
<body data-section="components" data-page="modal" data-prefix="../">
<main class="ds-main">
  <p class="ds-kicker">Components</p>
  <h1>Modal</h1>
  <p class="ds-lede">Scrim + centered glass panel. Product uses <code>.scrim.on</code> to show.</p>
  <div class="ds-status documented">Documented</div>
  
    <div class="ds-demo center" style="background:rgba(4,3,6,.45)">
      <div class="modal-static">
        <h3>Forget this note?</h3>
        <p class="lede">It leaves the journal. Insights tied only to it go with it.</p>
        <div class="modal-actions">
          <button class="ghost" type="button">Cancel</button>
          <button class="ghost danger" type="button">Forget</button>
        </div>
      </div>
    </div>
    <p>Classes: <code>.scrim</code>, <code>.modal</code>, <code>.modal-actions</code>. Z-index <code>--z-scrim</code> (40).</p>
    
</main>
<script src="../assets/nav.js"></script>
</body>
</html>
