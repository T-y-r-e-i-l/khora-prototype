<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chip — Khora Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/demos.css">
</head>
<body data-section="components" data-page="chip" data-prefix="../">
<main class="ds-main">
  <p class="ds-kicker">Components</p>
  <h1>Chip</h1>
  <p class="ds-lede">Filter and attribute pills. Toggle <code>.off</code> to mute a lane.</p>
  <div class="ds-status documented">Documented</div>
  
    <div class="ds-demo">
      <button class="chip" type="button"><span class="orb sm" style="--c:var(--resonance)"></span> Resonance <span class="n">4</span></button>
      <button class="chip" type="button"><span class="orb sm" style="--c:var(--tension)"></span> Tension <span class="n">2</span></button>
      <button class="chip off" type="button"><span class="orb sm" style="--c:var(--clarity)"></span> Clarity <span class="n">0</span></button>
    </div>
    <p>Pair an <code>.orb.sm</code> when the chip maps to a category.</p>
    
</main>
<script src="../assets/nav.js"></script>
</body>
</html>
