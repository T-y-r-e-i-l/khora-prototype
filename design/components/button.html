<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button — Khora Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/demos.css">
</head>
<body data-section="components" data-page="button" data-prefix="../">
<main class="ds-main">
  <p class="ds-kicker">Components</p>
  <h1>Button</h1>
  <p class="ds-lede">Uppercase letterspaced actions. Ghost for bordered chrome; micro for quiet text actions; solid for primary.</p>
  <div class="ds-status documented">Documented</div>
  
    <p class="ds-meta">Preview</p>
    <div class="ds-demo">
      <button class="ghost solid" type="button">Primary</button>
      <button class="ghost" type="button">Ghost</button>
      <button class="ghost danger" type="button">Danger</button>
      <button class="micro" type="button">Micro</button>
      <button class="ghost" type="button" disabled>Disabled</button>
    </div>
    <h2>Class contract</h2>
    <table class="ds-table">
      <thead><tr><th>Class</th><th>Role</th></tr></thead>
      <tbody>
        <tr><td><code>.ghost</code></td><td>Default bordered control</td></tr>
        <tr><td><code>.ghost.solid</code></td><td>High-emphasis fill</td></tr>
        <tr><td><code>.ghost.danger</code></td><td>Destructive</td></tr>
        <tr><td><code>.micro</code></td><td>Borderless quiet action</td></tr>
      </tbody>
    </table>
    
</main>
<script src="../assets/nav.js"></script>
</body>
</html>
