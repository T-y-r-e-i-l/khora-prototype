<body data-section="foundations" data-page="icons" data-prefix="../">
<main class="ds-main">
  <p class="ds-kicker">Foundations</p>
  <h1>Icons</h1>
  <p class="ds-lede">Inline SVG only — 24×24 strokes in sidenav, smaller marks in chrome. No icon font.</p>
  
  
    <div class="ds-demo" style="color:var(--ink-2)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="2.4" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="8.4" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 3"/></svg>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 7h14M5 12h10M5 17h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
    <p>Stroke weight ~1.4–1.6. Color inherits from the control (<code>currentColor</code>). Active nav tints the glyph with <code>--stance</code>.</p>
    
</main>
<script src="../assets/nav.js"></script>
</body>
